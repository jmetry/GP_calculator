<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly GP% Calculator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto+Mono:wght@400;500;700&display=swap');

  :root{
    --paper:#e9dfc8;
    --paper-dark:#dcd0b2;
    --ink:#2b2420;
    --blood:#8a2b23;
    --blood-dark:#6e211b;
    --line:#b8a97e;
    --good:#3f6b3f;
    --warn:#9a6a1a;
    --bad:#8a2b23;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 1px, transparent 1px, transparent 3px),
      var(--paper);
    font-family:'Roboto Mono', monospace;
    color:var(--ink);
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
  }

  .ticket{
    width:100%;
    max-width:420px;
    background:var(--paper);
    border:2px solid var(--ink);
    position:relative;
    box-shadow:6px 6px 0 rgba(43,36,32,0.15);
  }

  .ticket::before{
    content:"";
    position:absolute;
    inset:6px;
    border:1px dashed var(--line);
    pointer-events:none;
  }

  .header{
    text-align:center;
    padding:22px 20px 16px;
    border-bottom:2px solid var(--ink);
  }

  .header .eyebrow{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:0.35em;
    color:var(--blood);
    font-weight:600;
  }

  .header h1{
    font-family:'Oswald', sans-serif;
    font-size:26px;
    letter-spacing:0.04em;
    margin:6px 0 2px;
    font-weight:700;
    text-transform:uppercase;
  }

  .header .sub{
    font-size:11px;
    color:#6b6156;
    letter-spacing:0.06em;
  }

  .cut-line{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 20px;
    margin-top:14px;
  }
  .cut-line span{
    font-size:9px;
    letter-spacing:0.2em;
    color:#8a7f6f;
  }
  .cut-line::before, .cut-line::after{
    content:"";
    flex:1;
    border-top:1px dashed var(--line);
  }

  form{
    padding:16px 20px 4px;
  }

  .field{
    margin-bottom:16px;
  }

  label{
    display:block;
    font-family:'Oswald', sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    margin-bottom:6px;
    color:var(--ink);
  }

  .input-wrap{
    position:relative;
    display:flex;
    align-items:center;
    border-bottom:2px solid var(--ink);
  }

  .input-wrap .prefix{
    font-size:14px;
    color:var(--blood);
    font-weight:700;
    margin-right:4px;
  }

  input[type="number"]{
    flex:1;
    width:100%;
    border:none;
    background:transparent;
    font-family:'Roboto Mono', monospace;
    font-size:16px;
    padding:8px 2px;
    color:var(--ink);
    outline:none;
  }

  input[type="number"]:focus-visible{
    outline:2px solid var(--blood);
    outline-offset:2px;
  }

  input::placeholder{ color:#a89b86; }

  .results{
    margin:20px 20px 22px;
    padding-top:16px;
    border-top:2px solid var(--ink);
  }

  .row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:7px 0;
    border-bottom:1px dotted var(--line);
    font-size:13px;
  }

  .row .k{
    color:#5a5147;
    letter-spacing:0.03em;
  }

  .row .v{
    font-weight:700;
    font-size:15px;
  }

  .row.total{
    border-bottom:none;
    border-top:2px solid var(--ink);
    margin-top:8px;
    padding-top:14px;
  }

  .row.total .k{
    font-family:'Oswald', sans-serif;
    text-transform:uppercase;
    font-size:12px;
    color:var(--ink);
    letter-spacing:0.08em;
  }

  .row.total .v{
    font-size:17px;
  }

  .gp-display{
    text-align:center;
    margin-top:22px;
  }

  .gp-percent{
    font-family:'Oswald', sans-serif;
    font-size:52px;
    font-weight:700;
    line-height:1;
    color:var(--ink);
  }

  .gp-percent.good{ color:var(--good); }
  .gp-percent.warn{ color:var(--warn); }
  .gp-percent.bad{ color:var(--bad); }

  .gp-label{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#8a7f6f;
    margin-top:6px;
  }

  .footer-note{
    text-align:center;
    padding:14px 20px 20px;
    font-size:9.5px;
    color:#8a7f6f;
    letter-spacing:0.12em;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<div class="ticket">
  <div class="header">
    <div class="eyebrow">Weekly Ledger</div>
    <h1>GP% Calculator</h1>
    <div class="sub">Purveyor spend vs. net revenue</div>
  </div>

  <div class="cut-line"><span>ENTER SPEND</span></div>

  <form>
    <div class="field">
      <label for="outWest">Outwest — spend this week</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input type="number" id="outWest" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>

    <div class="field">
      <label for="westCoast">West Coast Prime — spend this week</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input type="number" id="westCoast" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>

    <div class="field">
      <label for="netRevenue">Net revenue — this week</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input type="number" id="netRevenue" placeholder="0.00" step="0.01" min="0">
      </div>
    </div>
  </form>

  <div class="results">
    <div class="cut-line" style="padding:0; margin-top:0;"><span>TICKET SUMMARY</span></div>
    <div class="row" style="margin-top:12px;">
      <span class="k">Outwest</span>
      <span class="v" id="outVal">$0.00</span>
    </div>
    <div class="row">
      <span class="k">West Coast Prime</span>
      <span class="v" id="wcVal">$0.00</span>
    </div>
    <div class="row total">
      <span class="k">Total purveyor spend</span>
      <span class="v" id="totalSpend">$0.00</span>
    </div>
    <div class="row total">
      <span class="k">Net revenue</span>
      <span class="v" id="netVal">$0.00</span>
    </div>

    <div class="gp-display">
      <div class="gp-percent" id="gpPercent">—</div>
      <div class="gp-label">GP% for the week</div>
    </div>
  </div>

  <div class="footer-note">Weekly purveyor &amp; revenue worksheet</div>
</div>

<script>
  const outWest = document.getElementById('outWest');
  const westCoast = document.getElementById('westCoast');
  const netRevenue = document.getElementById('netRevenue');

  function fmt(n) {
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function calculate() {
    const ow = parseFloat(outWest.value) || 0;
    const wc = parseFloat(westCoast.value) || 0;
    const rev = parseFloat(netRevenue.value) || 0;
    const totalSpend = ow + wc;

    document.getElementById('outVal').textContent = fmt(ow);
    document.getElementById('wcVal').textContent = fmt(wc);
    document.getElementById('totalSpend').textContent = fmt(totalSpend);
    document.getElementById('netVal').textContent = fmt(rev);

    const gpEl = document.getElementById('gpPercent');

    if (rev <= 0) {
      gpEl.textContent = '—';
      gpEl.className = 'gp-percent';
      return;
    }

    const gp = ((rev - totalSpend) / rev) * 100;
    gpEl.textContent = gp.toFixed(1) + '%';

    gpEl.className = 'gp-percent ' + (gp >= 40 ? 'good' : gp >= 30 ? 'warn' : 'bad');
  }

  [outWest, westCoast, netRevenue].forEach(el => el.addEventListener('input', calculate));
</script>

</body>
</html>
