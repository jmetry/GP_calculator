<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weekly GP% Calculator</title>
<style>
  :root {
    --bg: #1c1917;
    --card: #292524;
    --border: #44403c;
    --text: #f5f5f4;
    --muted: #a8a29e;
    --accent: #b45309;
    --accent-light: #f59e0b;
    --good: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    margin: 0;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px 0;
    color: var(--accent-light);
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px 0;
    font-size: 0.9rem;
  }
  .field {
    margin-bottom: 18px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap span {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
  }
  input[type="number"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px 10px 26px;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent-light);
  }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 22px 0;
  }
  .result-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-top: 8px;
  }
  .result-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 0.92rem;
    color: var(--muted);
  }
  .result-row.total {
    color: var(--text);
    font-weight: 600;
  }
  .gp-display {
    text-align: center;
    margin-top: 14px;
  }
  .gp-percent {
    font-size: 2.6rem;
    font-weight: 700;
    line-height: 1;
  }
  .gp-label {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }
  .good { color: var(--good); }
  .warn { color: var(--warn); }
  .bad { color: var(--bad); }
</style>
</head>
<body>
<div class="card">
  <h1>Weekly GP% Calculator</h1>
  <p class="subtitle">Purveyor spend vs. net revenue for the week</p>

  <div class="field">
    <label for="outWest">Outwest — spend this week</label>
    <div class="input-wrap">
      <span>$</span>
      <input type="number" id="outWest" placeholder="0.00" step="0.01" min="0">
    </div>
  </div>

  <div class="field">
    <label for="westCoast">West Coast Prime — spend this week</label>
    <div class="input-wrap">
      <span>$</span>
      <input type="number" id="westCoast" placeholder="0.00" step="0.01" min="0">
    </div>
  </div>

  <div class="field">
    <label for="netRevenue">Net Revenue — this week</label>
    <div class="input-wrap">
      <span>$</span>
      <input type="number" id="netRevenue" placeholder="0.00" step="0.01" min="0">
    </div>
  </div>

  <div class="divider"></div>

  <div class="result-box">
    <div class="result-row">
      <span>Outwest</span>
      <span id="outVal">$0.00</span>
    </div>
    <div class="result-row">
      <span>West Coast Prime</span>
      <span id="wcVal">$0.00</span>
    </div>
    <div class="result-row total">
      <span>Total Purveyor Spend</span>
      <span id="totalSpend">$0.00</span>
    </div>
    <div class="result-row total">
      <span>Net Revenue</span>
      <span id="netVal">$0.00</span>
    </div>

    <div class="gp-display">
      <div class="gp-percent" id="gpPercent">—</div>
      <div class="gp-label">GP% for the week</div>
    </div>
  </div>
</div>

<script>
  const outWest = document.getElementById('outWest');
  const westCoast = document.getElementById('westCoast');
  const netRevenue = document.getElementById('netRevenue');

  function fmt(n) {
    return '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  }

  function calculate() {
    const ow = parseFloat(outWest.value) || 0;
    const wc = parseFloat(westCoast.value) || 0;
    const rev = parseFloat(netRevenue.value) || 0;
    const totalSpend = ow + wc;

    document.getElementById('outVal').textContent = fmt(ow);
    document.getElementById('wcVal').textContent = fmt(wc);
    document.getElementById('totalSpend').textContent = fmt(totalSpend);
    document.getElementById('netVal').textContent = fmt(rev);

    const gpEl = document.getElementById('gpPercent');

    if (rev <= 0) {
      gpEl.textContent = '—';
      gpEl.className = 'gp-percent';
      return;
    }

    const gp = ((rev - totalSpend) / rev) * 100;
    gpEl.textContent = gp.toFixed(1) + '%';

    gpEl.className = 'gp-percent ' + (gp >= 40 ? 'good' : gp >= 30 ? 'warn' : 'bad');
  }

  [outWest, westCoast, netRevenue].forEach(el => el.addEventListener('input', calculate));
</script>
</body>
</html>
